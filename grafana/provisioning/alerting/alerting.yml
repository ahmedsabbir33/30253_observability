apiVersion: 1

contactPoints:
  - orgId: 1
    name: mailpit-email-inbox
    receivers:
      - uid: mailpit_email_receiver
        type: email
        disableResolveMessage: false
        settings:
          addresses: ${ALERT_RECIPIENT_EMAIL}
          singleEmail: true
          subject: "[{{ .Status | toUpper }}] Candidate 30253 Alert: {{ .CommonLabels.alertname }}"

policies:
  - orgId: 1
    receiver: mailpit-email-inbox
    group_by: ['alertname', 'service']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1h

groups:
  - orgId: 1
    name: order-api-critical-alerts
    folder: Observability Assessment
    interval: 10s
    rules:
      - uid: order_api_high_error_rate
        title: Order API High HTTP Error Rate (Over 20%)
        condition: C
        for: 10s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: "Order API HTTP failure rate exceeded 20% threshold over the last 1 minute."
          description: "High rate of HTTP 400/500 responses detected on POST /api/orders. Investigate upstream payment gateway or payload validation."
        labels:
          severity: critical
          service: order-observability-api
          candidate_id: "30253"
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "(sum(rate(order_api_http_requests_total{job=\"order-api\", outcome=\"failure\"}[1m])) / clamp_min(sum(rate(order_api_http_requests_total{job=\"order-api\"}[1m])), 0.0001)) * 100"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
